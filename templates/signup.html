<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartPlot - Sign Up</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: white;

            background:
                linear-gradient(
                    rgba(2, 6, 23, 0.72),
                    rgba(2, 6, 23, 0.85)
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #0f3d56,
                    #064e3b
                );
        }

        .signup-card {
            width: 100%;
            max-width: 460px;

            padding: 38px;

            border-radius: 24px;

            background: rgba(8, 25, 45, 0.75);

            border: 1px solid rgba(103, 232, 249, 0.35);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
        }

        .logo span {
            color: #4ade80;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-top: 8px;
            margin-bottom: 28px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fecaca;
            text-align: center;
        }

        .success {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #bbf7d0;
            text-align: center;
        }

        .group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid rgba(255, 255, 255, 0.20);

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 15px;

            outline: none;
        }

        input::placeholder {
            color: #94a3b8;
        }

        select option {
            color: black;
        }

        input:focus,
        select:focus {
            border-color: #22d3ee;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #22c55e,
                #10b981
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .login-link a {
            color: #67e8f9;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .signup-card {
                padding: 28px 20px;
            }

            .logo {
                font-size: 28px;
            }
        }

    </style>

</head>

<body>

    <div class="signup-card">

        <div class="logo">
            🏡 Smart<span>Plot</span>
        </div>

        <div class="subtitle">
            Find Plots. Connect Directly with Owners.
        </div>

        <h2>Create Your Account</h2>


        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}


        {% if success %}
            <div class="success">
                {{ success }}
            </div>
        {% endif %}


        <form action="/signup" method="POST">

            <div class="group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="group">

                <label for="role">
                    Account Type
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="">
                        Select account type
                    </option>

                    <option value="buyer">
                        Buyer
                    </option>

                    <option value="seller">
                        Seller
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="signup-btn">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


        <div class="back">

            <a href="/">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
